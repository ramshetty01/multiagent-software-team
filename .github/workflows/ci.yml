name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self check
        run: scripts/self_check.py
      - name: Secret scan
        run: |
          ! git grep -nE '(gho_|sk-[A-Za-z0-9]|ANTHROPIC_API_KEY=.+|OPENAI_API_KEY=.+|GOOGLE_API_KEY=.+)' -- ':!*.example' ':!docs/*'

