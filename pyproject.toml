[project]
name = "multiagent-software-team"
version = "0.1.0"
description = "MVP multi-agent issue-to-PR workflow"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6",
  "daytona>=0.198",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
mast = "mast.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
